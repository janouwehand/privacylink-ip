name: Deploy (placeholder)

# PLACEHOLDER WORKFLOW.
#
# This workflow is intentionally NOT wired to the existing PrivacyLink
# deployment. It builds an immutable image and contains a guarded SSH deploy
# step. Before enabling it, configure the repository variables and secrets
# listed below and verify the target VPS conventions.
#
# Repository variables (Settings -> Variables):
#   DEPLOY_ENABLED        "true" to enable the deploy job
#   APP_DIR               absolute directory of the compose project on the VPS
#   PRIVACYLINK_IP_IMAGE  image name used by the VPS compose file
#   SMOKE_URL             e.g. https://ip.privacylink.nl/api/ip
#
# Repository secrets (Settings -> Secrets):
#   VPS_HOST              VPS hostname or public IP (<YOUR_VPS_IPV4>)
#   VPS_USER              least-privilege deploy user
#   VPS_SSH_KEY           private key for that user
#   VPS_KNOWN_HOSTS       pinned host key line for the VPS
#
# Rollback: re-run this workflow with a previous version tag, or on the VPS
# run `docker compose up -d` after setting PRIVACYLINK_IP_IMAGE to the previous
# immutable tag. Never reuse mutable tags.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable version tag, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_BASE: ghcr.io/${{ github.repository }}/privacylink-ip

jobs:
  build-image:
    name: Build and push immutable image
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      version_tag: ${{ steps.meta.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tags
        id: meta
        run: |
          SHA_TAG="sha-${GITHUB_SHA::12}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_TAG="${{ inputs.version }}"
          else
            VERSION_TAG="${GITHUB_REF_NAME}"
          fi
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE_BASE }}:${{ steps.meta.outputs.version_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: SSH deploy (placeholder)
    runs-on: ubuntu-latest
    needs: build-image
    # Guard: nothing is deployed until DEPLOY_ENABLED is explicitly set.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    steps:
      - name: Explain placeholder
        run: |
          echo "Deploying ${{ env.IMAGE_BASE }}:${{ needs.build-image.outputs.sha_tag }}"
          echo "This job is a placeholder. Verify DNS, Docker network, Caddy"
          echo "and secrets before enabling DEPLOY_ENABLED."

      - name: Install SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy image on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ vars.APP_DIR }}
          IMAGE_NAME: ${{ vars.PRIVACYLINK_IP_IMAGE }}
          IMAGE_TAG: ${{ needs.build-image.outputs.sha_tag }}
        run: |
          ssh -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd '$APP_DIR' && \
             PRIVACYLINK_IP_IMAGE='$IMAGE_NAME:$IMAGE_TAG' docker compose pull && \
             PRIVACYLINK_IP_IMAGE='$IMAGE_NAME:$IMAGE_TAG' docker compose up -d"

      - name: Public smoke test
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 10 "$SMOKE_URL" > /dev/null; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 5
          done
          echo "Smoke test failed: check Caddy, DNS and container health"
          exit 1

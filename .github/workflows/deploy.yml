name: Deploy

# Builds one immutable image and deploys that exact digest to the Contabo VPS
# (softable.nl) through the root-owned /usr/local/sbin/privacylink-ip-deploy
# helper. The deploy job is bound to the protected "production" environment, so
# it needs a manual approval when the repository rules require one.
#
# Required secrets in the "production" environment:
#   VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY, VPS_SSH_KNOWN_HOSTS
#
# Prepare the host first: see deploy/vps/README.md.

on:
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Build and push the image without deploying (used once to create and publish the GHCR package)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-privacylink-ip
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/janouwehand/privacylink-ip
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  verify:
    name: Build, test and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PrivacyLink.Ip.slnx

      - name: Build (warnings as errors)
        run: dotnet build PrivacyLink.Ip.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test PrivacyLink.Ip.slnx -c Release --no-build --no-restore

      - name: Format check
        run: |
          dotnet format src/PrivacyLink.Ip/PrivacyLink.Ip.csproj --verify-no-changes --no-restore
          dotnet format tests/PrivacyLink.Ip.Tests/PrivacyLink.Ip.Tests.csproj --verify-no-changes --no-restore

  build-image:
    name: Build and push immutable image
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tags
        id: meta
        run: |
          SHA_TAG="sha-${GITHUB_SHA::12}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION_TAG="${GITHUB_REF_NAME}"
          else
            VERSION_TAG="${SHA_TAG}"
          fi
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/janouwehand/privacylink-ip
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-image
    if: ${{ !inputs.publish_only }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install SSH key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy image digest on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_DIGEST: ${{ needs.build-image.outputs.digest }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/privacylink-ip-deploy '${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}'"

      - name: Verify both address families from the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          health=$(curl -fsS --max-time 10 -H 'Host: ip.privacylink.nl' -H 'X-Forwarded-Proto: https' http://127.0.0.1:8082/healthz)
          v4=$(curl -4 -fsS --max-time 10 https://v4.ip.privacylink.nl/api/ip)
          v6=$(curl -6 -fsS --max-time 10 https://v6.ip.privacylink.nl/api/ip)
          echo "health=${health}"
          echo "v4=${v4}"
          echo "v6=${v6}"
          [[ "$health" == "ok" ]]
          [[ "$v4" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]
          [[ "$v6" == *:* ]]
          REMOTE

      - name: Verify public HTTPS and forwarded-header handling
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 https://ip.privacylink.nl/healthz
          resolved=$(curl -4 -fsS --max-time 10 https://ip.privacylink.nl/api/ip)
          spoofed=$(curl -4 -fsS --max-time 10 -H 'X-Forwarded-For: 1.2.3.4' https://ip.privacylink.nl/api/ip)
          echo "resolved=${resolved}"
          echo "spoofed_attempt=${spoofed}"
          [[ "$resolved" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]
          [[ "$spoofed" != "1.2.3.4" ]]
          [[ "$spoofed" == "$resolved" ]]

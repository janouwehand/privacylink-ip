name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-test:
    name: Build, test and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          # global.json pins 10.0.100 with rollForward=latestMajor.

      - name: Restore
        run: dotnet restore PrivacyLink.Ip.slnx

      - name: Build (warnings as errors)
        run: dotnet build PrivacyLink.Ip.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test PrivacyLink.Ip.slnx
          -c Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Format check
        run: |
          dotnet format src/PrivacyLink.Ip/PrivacyLink.Ip.csproj --verify-no-changes --no-restore
          dotnet format tests/PrivacyLink.Ip.Tests/PrivacyLink.Ip.Tests.csproj --verify-no-changes --no-restore

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push, no deploy)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: privacylink-ip:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
